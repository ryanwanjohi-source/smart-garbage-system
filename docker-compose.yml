services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: smartbin
      POSTGRES_PASSWORD: smartbin
      POSTGRES_DB: smartbin
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  mqtt:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

volumes:
  pgdata:
