<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Smart Garbage — Admin Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-dark bg-dark">
  <div class="container-fluid">
    <span class="navbar-brand">♻ Smart Garbage — Nairobi Pilot</span>
    <span class="text-light small" id="clock"></span>
  </div>
</nav>

<div class="container-fluid mt-3">
  <div class="row">
    <div class="col-md-8">
      <div class="card">
        <div class="card-header d-flex justify-content-between align-items-center">
          <strong>Bin telemetry</strong>
          <button class="btn btn-sm btn-outline-secondary" onclick="loadBins()">Refresh</button>
        </div>
        <div class="card-body p-0">
          <table class="table table-striped mb-0">
            <thead><tr><th>Bin</th><th>Location</th><th>Fill</th><th>Mass (kg)</th><th>Last seen</th></tr></thead>
            <tbody id="binRows"><tr><td colspan="5" class="text-center">loading…</td></tr></tbody>
          </table>
        </div>
      </div>
    </div>
    <div class="col-md-4">
      <div class="card">
        <div class="card-header"><strong>Collection route</strong></div>
        <div class="card-body">
          <label class="form-label">Fill threshold (%)</label>
          <input id="threshold" type="number" class="form-control" value="70" min="1" max="100">
          <button class="btn btn-primary mt-2 w-100" onclick="optimize()">Optimize route</button>
          <div id="routeOut" class="mt-3"></div>
        </div>
      </div>
      <div class="card mt-3">
        <div class="card-header"><strong>Send bin command</strong></div>
        <div class="card-body">
          <input id="cmdBin" class="form-control mb-2" placeholder="Bin code (e.g. NRB-001)" list="binList">
          <datalist id="binList"></datalist>
          <div class="btn-group w-100" role="group">
            <button class="btn btn-outline-success" onclick="sendCmd(0)">Sort ♻</button>
            <button class="btn btn-outline-warning" onclick="sendCmd(1)">Sort organic</button>
            <button class="btn btn-outline-secondary" onclick="sendCmd(2)">Sort general</button>
          </div>
          <div id="cmdOut" class="mt-2"></div>
          <small class="text-muted">Publishes to <code>smartbin/&lt;code&gt;/command</code> via the API.</small>
        </div>
      </div>
      <div class="card mt-3">
        <div class="card-header d-flex justify-content-between align-items-center">
          <strong>Alerts (≥ 80%)</strong>
          <button class="btn btn-sm btn-outline-secondary" onclick="loadAlerts()">Refresh</button>
        </div>
        <div class="card-body" id="alertRows"><small class="text-muted">loading…</small></div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/app.js"></script>
</body>
</html>
